<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08080a"></stop>
      <stop offset="50%" style="stop-color:#0a0a0c"></stop>
      <stop offset="100%" style="stop-color:#0c0c10"></stop>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#40E0D0;stop-opacity:0.12"></stop>
      <stop offset="100%" style="stop-color:#40E0D0;stop-opacity:0"></stop>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.08"></stop>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0"></stop>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"></path>
    </pattern>
    <style>
      @keyframes pulse1 {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes pulse2 {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes pulse3 {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes ringRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .step1 { animation: pulse1 3s ease-in-out infinite; }
      .step2 { animation: pulse2 3s ease-in-out infinite 1s; }
      .step3 { animation: pulse3 3s ease-in-out infinite 2s; }
      .ring-spin {
        animation: ringRotate 20s linear infinite;
        transform-origin: 640px 360px;
      }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"></rect>
  <rect width="1280" height="720" fill="url(#grid)"></rect>
  <ellipse cx="640" cy="360" rx="500" ry="350" fill="url(#glowCenter)"></ellipse>
  <ellipse cx="150" cy="550" rx="300" ry="200" fill="url(#glowRed)"></ellipse>
  <ellipse cx="1130" cy="150" rx="250" ry="180" fill="url(#glowRed)" opacity="0.5"></ellipse>
  <g class="ring-spin" opacity="0.12">
    <circle cx="640" cy="360" r="340" fill="none" stroke="#40E0D0" stroke-width="1" stroke-dasharray="20 40"></circle>
    <circle cx="640" cy="360" r="300" fill="none" stroke="#40E0D0" stroke-width="1" stroke-dasharray="10 30"></circle>
  </g>
  <path d="M 30 80 L 30 30 L 80 30" fill="none" stroke="rgba(64,224,208,0.4)" stroke-width="1.5"></path>
  <path d="M 1200 640 L 1250 640 L 1250 690" fill="none" stroke="rgba(64,224,208,0.4)" stroke-width="1.5"></path>
  <g class="step1">
    <circle cx="72" cy="355" r="10" fill="white" filter="url(#glow)"></circle>
    <text x="97" y="380" font-family="Georgia, serif" font-size="100" font-weight="normal" fill="white" opacity="0.95">Deploy.</text>
  </g>
  <g class="step2">
    <circle cx="480" cy="355" r="10" fill="#40E0D0" filter="url(#glow)"></circle>
    <text x="505" y="380" font-family="Georgia, serif" font-size="100" font-weight="normal" fill="#40E0D0" opacity="0.95" font-style="italic">Scale.</text>
  </g>
  <g class="step3">
    <circle cx="840" cy="355" r="10" fill="white" filter="url(#strongGlow)"></circle>
    <text x="865" y="380" font-family="Georgia, serif" font-size="100" font-weight="bold" fill="white" opacity="0.95">Win.</text>
  </g>
  <g opacity="0.35">
    <circle cx="300" cy="500" r="3" fill="#40E0D0"></circle>
    <circle cx="550" cy="530" r="2" fill="#40E0D0"></circle>
    <circle cx="750" cy="490" r="3" fill="#40E0D0"></circle>
    <circle cx="950" cy="520" r="2" fill="#40E0D0"></circle>
    <circle cx="200" cy="220" r="2" fill="#FF6B6B"></circle>
    <circle cx="1050" cy="200" r="2" fill="#40E0D0"></circle>
    <circle cx="400" cy="180" r="2" fill="#40E0D0"></circle>
    <circle cx="850" cy="220" r="3" fill="#FF6B6B"></circle>
  </g>
  <text x="640" y="660" font-family="'Courier New', monospace" font-size="12" fill="rgba(255,255,255,0.25)" letter-spacing="3" text-anchor="middle">TAAS // 2025</text>
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.02)"></rect>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#scanlines)"></rect>
</svg>
